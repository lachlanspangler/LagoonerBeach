name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run coverage
      # the shipped puzzle pack must be exactly reproducible from the generator
      - run: npm run puzzles && git diff --exit-code src/content/puzzles.json
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run size
      - run: npx playwright test --project=chromium --project=webkit
      - run: npx playwright test --project=perf --workers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright
          path: |
            test-results/
            playwright-report/
            artifacts/
