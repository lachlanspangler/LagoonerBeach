<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F4EDE2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1622" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Lagooner Beach — close a loop. Water fills it, the ring pops." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Lagooner Beach</title>
    <!--
      The two first-frame fonts start loading here, before the stylesheet: the same @font-face rules
      as style.css (so it's one request each) + a load. A <link rel=preload> can't do it for both
      engines: WebKit only reuses it without `crossorigin`, Chromium only with it — the other one
      fetched the font twice and warned "preloaded but not used".
    -->
    <style>
      @font-face {
        font-family: 'Lagoon UI';
        src: url('/fonts/lagoon-ui.woff2') format('woff2');
        font-weight: 200 1000;
        font-display: swap;
      }
      @font-face {
        font-family: 'Lagoon Display';
        src: url('/fonts/lagoon-display-900.woff2') format('woff2');
        font-weight: 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Lagoon Title';
        src: url('/fonts/lagoon-title.woff2') format('woff2');
        font-weight: 800;
        font-display: block;
      }
    </style>
    <script>
      document.fonts?.load?.('800 16px "Lagoon UI"');
      document.fonts?.load?.('900 16px "Lagoon Display"');
      // The title screen (ADR 0015) is decided before first paint, so it never flashes in or out.
      // Skipped for deep links (?mode= ?seed=, a shared Daily), a warm return (< 10 min), the
      // "Open straight into the game" setting, and automated runs (unless ?title forces it, or
      // ?titlerules applies these rules as for a person: e2e).
      // The theme is applied here too, so the first frame is already Day or Night.
      (function () {
        var d = document.documentElement;
        var q = new URLSearchParams(location.search);
        var t = {};
        var th = 'auto';
        try {
          t = JSON.parse(localStorage.getItem('atoll.v1.title') || '{}') || {};
          th = (JSON.parse(localStorage.getItem('atoll.v1.profile') || '{}').settings || {}).theme || 'auto';
        } catch (e) {}
        if (th !== 'day' && th !== 'night') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        d.dataset.theme = th;
        var skip =
          q.has('mode') ||
          q.has('seed') ||
          q.has('notitle') ||
          t.off === true ||
          (typeof t.at === 'number' && Date.now() - t.at < 600000 && Date.now() >= t.at) ||
          (navigator.webdriver === true && !q.has('titlerules'));
        if (q.has('title')) skip = false;
        if (!skip) {
          d.dataset.title = '1';
          document.fonts?.load?.('800 16px "Lagoon Title"');
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Lagooner Beach game board" role="img"></canvas>
    <div id="ui">
      <main id="title" class="title" aria-labelledby="title-word">
        <canvas id="title-bg" aria-hidden="true"></canvas>
        <div class="t-lock">
          <h1 id="title-word" class="title-word" aria-label="Lagooner Beach">
            <span>Lagooner</span> <span>Beach</span>
          </h1>
          <span class="t-wave" aria-hidden="true"></span>
          <p class="t-tag">Close a loop. Water fills it.</p>
        </div>
        <button id="t-play" class="t-play" type="button">
          <span class="t-play-ic" aria-hidden="true"></span
          ><span class="t-play-t"><span class="t-play-l">Play</span><small class="t-play-s"></small></span>
        </button>
      </main>
    </div>
    <div id="sr" class="sr-only" aria-live="polite"></div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
